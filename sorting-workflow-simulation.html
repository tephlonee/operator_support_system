<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorting Workflow Simulation</title>
<style>
  :root { --navy:#14213D; --paper:#F5F4EF; --muted:#5b6676; --accent:#C2410C; --panel:rgba(245,244,239,0.95); --btn:#fff; --btn-hover:#eef1f5; --line:#c3c9d2; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --navy:#e6ebf2; --muted:#a3adbb; --panel:rgba(22,28,40,0.94); --btn:#1f2937; --btn-hover:#2b3647; --line:#3a4555; } }
  :root[data-theme="dark"] { --navy:#e6ebf2; --muted:#a3adbb; --panel:rgba(22,28,40,0.94); --btn:#1f2937; --btn-hover:#2b3647; --line:#3a4555; }
  html,body { margin:0; height:100%; overflow:hidden; background:#cfd5dc; font-family:"Segoe UI", system-ui, Arial, sans-serif; }
  #c { display:block; width:100vw; height:100vh; }
  .panel { position:absolute; background:var(--panel); color:var(--navy); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.18); }
  #tabs { left:50%; transform:translateX(-50%); top:12px; padding:6px; display:flex; gap:4px; flex-wrap:wrap; justify-content:center; max-width:calc(100vw - 32px); box-sizing:border-box; }
  #tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #title { left:16px; top:72px; padding:12px 16px; width:330px; box-sizing:border-box; }
  #title h1 { font-size:17px; margin:0 0 6px; }
  #title p { font-size:13px; margin:3px 0; color:var(--muted); line-height:1.4; }
  #hud { margin-top:8px; padding-top:8px; border-top:1px solid #d6d9de; display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:13px; }
  #hud b { font-variant-numeric:tabular-nums; text-align:right; }
  #hud .note { grid-column:1 / 3; font-size:11px; color:var(--muted); }
  #steps { right:16px; top:72px; padding:12px 14px; width:310px; box-sizing:border-box; }
  #steps h2 { font-size:13px; margin:0 0 8px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); }
  #steps ol { margin:0; padding-left:20px; font-size:13px; line-height:1.4; }
  #steps li { margin-bottom:5px; color:#8a94a3; }
  #steps li.active { color:var(--navy); font-weight:600; }
  #steps li.done { color:var(--muted); }
  #caption { left:50%; transform:translateX(-50%); bottom:110px; padding:12px 20px; font-size:17px; font-weight:600; width:min(820px, calc(100vw - 32px)); box-sizing:border-box; text-align:center; line-height:1.4; }
  #controls { left:50%; transform:translateX(-50%); bottom:16px; padding:8px 10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center; width:max-content; max-width:calc(100vw - 32px); box-sizing:border-box; }
  button { font:inherit; font-size:13px; border:1px solid var(--line); background:var(--btn); color:var(--navy); padding:7px 11px; border-radius:8px; cursor:pointer; }
  button:hover { background:var(--btn-hover); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.on { background:var(--btn-hover); border-color:#2f5da8; }
  #tabs button.on:hover { background:var(--accent); }
  .sep { width:1px; height:24px; background:#c3c9d2; margin:0 2px; }
  label { font-size:13px; display:flex; align-items:center; gap:4px; }
  @media (max-width:1300px) { #steps { display:none; } }
  @media (max-width:760px) {
    #tabs { left:16px; right:16px; transform:none; max-width:none; }
    #title { width:auto; left:16px; right:16px; padding:8px 12px; }
    #title .desc, #title .foot { display:none; }
    #hud { grid-template-columns:1fr auto 1fr auto; }
    #caption { font-size:14px; padding:8px 12px; }
    button { padding:6px 8px; font-size:12px; }
    .hide-sm { display:none; }
  }

}

  const p0 = worker.position.clone(), p1 = V3(x, 0, z), dist = p0.distanceTo(p1);
  if (dist > 0.02) {
    await turnTo(Math.atan2(p1.x - p0.x, p1.z - p0.z));
    worker.userData.walking = true;
    await tween(dist / 1.25, f => worker.position.lerpVectors(p0, p1, f), f => f);
    worker.userData.walking = false; worker.userData.legL.rotation.x = worker.userData.legR.rotation.x = 0;
  }

}

}

    if (SCREEN) p.onPallet = true; else placed(p);   // with the app: confirmed per pallet afterwards
  })));
  if (!SCREEN) { ui.next = null; redraw(); }
}
async function palletOut() { await tween(3.5, f => pallet.position.z = -3.4 * (1 - f)); }
async function palletIn() { await tween(3.5, f => pallet.position.z = -3.4 * f); }
async function craneToTable() {
  await tween(2.0, f => bridge.position.z = 3.6 * (1 - f));
  await tween(1.6, f => spreader.position.y = 3.0 + (GRAB_Y - 3.0) * f);
  spreader.attach(sheet); await wait(0.3);
  await tween(1.4, f => spreader.position.y = GRAB_Y + (2.1 - GRAB_Y) * f);
  const back = palletIn();   // the empty pallet goes straight back: the laser can cut the next sheet
  await tween(3.0, f => bridge.position.z = TABLE_Z * f);
  await tween(1.4, f => spreader.position.y = 2.1 + (GRAB_Y - 2.1) * f);
  scene.attach(sheet); await wait(0.2);
  await Promise.all([tween(1.4, f => spreader.position.y = GRAB_Y + (3.0 - GRAB_Y) * f), back]);
  tween(2.5, f => bridge.position.z = TABLE_Z + (7.0 - TABLE_Z) * f);   // park the crane out of the way
}
// cobot motion
async function cobotMove(P, dur) { const p0 = cobotCur.clone(); await tween(dur, f => { cobotCur.lerpVectors(p0, P, f); cobotIK(cobotCur); }); }
async function cobotPick(p, k = 1) {
  ui.cobotNext = p; redraw();
  const v = worldOf(p.mesh), top = v.y + T;
  await cobotMove(V3(v.x, top + 0.3, v.z), 0.9 * k);
  await cobotMove(V3(v.x, top + 0.01, v.z), 0.45 * k);
  if (p.fail) {   // held by a micro-joint: suction lifts nothing, piece handed to the operator
    await wait(0.5 * k); await cobotMove(V3(v.x, top + 0.3, v.z), 0.4 * k);
    p.handover = true; ui.cobotNext = null; ui.feedback = `Cobot could not lift ${p.partNo} (micro-joint): handed to you. Place it on ${p.pallet.label}, then tap it and Confirm.`; redraw(); return;
  }
  tip.attach(p.mesh);
  await cobotMove(V3(v.x, top + 0.35, v.z), 0.4 * k);
  const t = p.pallet.trolley, lp = stackPos(t); t.group.updateWorldMatrix(true, false);
  const w = t.group.localToWorld(lp.clone());
  await cobotMove(V3(w.x, w.y + 0.3, w.z), 1.0 * k);
  await cobotMove(V3(w.x, w.y + 0.02, w.z), 0.35 * k);
  t.group.attach(p.mesh); p.mesh.position.copy(lp);
  placed(p); ui.cobotNext = null; redraw();
  await cobotMove(V3(w.x, w.y + 0.3, w.z), 0.3 * k);
}

let camAnim = null;
const presets = {
  overview:() => V.table ? [V3(6.6, 5.6, 10.0), V3(0, 0.9, 2.2)] : [V3(6.0, 4.6, 7.2), V3(0, 0.9, 0.9)],
  operator:() => V.table ? [V3(1.6, 2.6, 7.6), V3(0, 0.9, 3.7)] : [V3(1.4, 2.5, 4.6), V3(-0.1, 0.9, 0.9)],
  display:() => {
    const { p, n } = dispStandPoint(); const side = V3(0, 1, 0).cross(n).normalize();
    return [p.clone().addScaledVector(n, 0.62).addScaledVector(side, 0.62).add(V3(0, 0.12, 0)), p];
  },
  top:() => [V3(0.01, 9.5, V.table ? 3.0 : 1.4), V3(0, 0, V.table ? 2.6 : 1.0)],
};
function cam(name, dur = 1.4) {
  const [p, t] = presets[name]();
  camAnim = { p0:camera.position.clone(), t0:controls.target.clone(), p1:p, t1:t, start:performance.now(), dur:dur * 1000 };
}
const autoCam = name => { if (document.getElementById('autocam').checked) cam(name); };
{ const [p, t] = presets.overview(); camera.position.copy(p); controls.target.copy(t); }

// Scenarios
// =====================================================================
const caption = document.getElementById('caption');
const STEPS = {
  v0:['Pallet comes out with sheet J14', 'Fetch the paper list from the printer', 'Bring 3 pallets, write the order on notes',
      'Per piece: read list → search sheet → pick → choose pallet → tally', 'Not sure of a count: re-check walk',
      'Rest of the sheet (fast-forward)', 'Done: errors only show up at final inspection'],
  v3:['Pallet comes out with sheet J14', 'Fetch the printed colour layout', 'Place the cards on the pallets as in the print legend',
      'Sort Blue 1: compare print and sheet, tick off', 'Sort Orange 2 (look-alike marked on the print)', 'Sort Green 3',
      'Done: plan could not be changed at the machine'],
  v1:['Pallet comes out with sheet J14', 'Tap J14 in the job list', 'Setup: how many pallets?', 'Setup: which parts on which pallet?',
      'Setup: place the cards on the pallets', 'Sort Blue 1 without touching the screen (one piece missing)', 'One tap: "✓ Blue 1 done"',
      'Sort Orange 2, one tap: "✓ Orange 2 done"', 'Summary, pallet goes back in'],
  v2:['Pallet comes out with sheet J14', 'Crane lifts the sheet to the table; pallet goes back in', 'Roll the screen to the table, tap J14',
      'Setup: how many pallets?', 'Setup: which parts on which pallet?', 'Setup: place the cards on the pallets',
      'Sort Blue 1, one tap: "✓ Blue 1 done"', 'Sort Orange 2, one tap: "✓ Orange 2 done"', 'Summary'],
  v4:['Pallet comes out with sheet J14', 'Crane lifts the sheet to the table; pallet goes back in', 'Tap J14 on the table screen',
      'Setup: cobot takes parts ≤ 2 kg, operator the rest', 'Setup: place the cards on the pallets',
      'Sort in parallel: operator Blue 1 (one tap at the end), cobot Orange 2 + Green 3', 'Hand-over: the cobot could not lift a piece', 'Summary'],
};
const stepList = document.getElementById('stepList');
stepList.innerHTML = STEPS[VID].map(s => `<li>${s}</li>`).join('');
const stepItems = [...stepList.querySelectorAll('li')];
function step(i, html) { stepItems.forEach((li, k) => li.className = k < i ? 'done' : k === i ? 'active' : ''); caption.innerHTML = html; }
const piecesOf = pl => pieces.filter(p => p.pallet === pl && p.status === 'open').sort((a, b) => a.cx - b.cx);

async function intro() {
  step(0, 'Pallet A comes out of the laser with sheet <b>J14</b>: 33 pieces of 3 part numbers for 3 orders.');
  autoCam('overview'); await palletOut(); await wait(0.3);
}

async function runV0() {
  await intro();
  step(1, 'The operator fetches the printed part list. It lists part numbers and quantities, not where each piece lies on the sheet.');
  await walkTo(-2.0, 3.0, -Math.PI / 2); await arms(0, -1.2, 0.25);
  displayGroup.userData.paper.visible = true; drawPaper(); await arms(0, 0, 0.2);
  autoCam('display'); await goToDisplay(); await wait(1.2);
  step(2, 'Three pallets are brought in. The order numbers are written on paper notes.');
  autoCam('overview'); await rollTrolleysIn(trolleys);
  step(3, 'For every piece: read the list, search the sheet for that part number, pick it, decide which pallet, go back and make a tally mark.');
  autoCam('operator');
  const seq = [...pieces].sort((a, b) => a.n - b.n);
  for (const p of seq.slice(0, 3)) {
    await readPaper(`Next: ${p.partNo} for ${p.order}`, 1.0);
    const cands = pieces.filter(q => q.status === 'open' && (q.partNo === p.partNo || q.other === p.partNo)).slice(0, 4);
    const st = pickStand(worldOf(p.mesh)); await walkTo(st.x, st.z, Math.PI);
    think(`Which one is ${p.partNo}?`); showQuestionMarks(cands); await wait(1.6); showArrow(p);
    think(null); await carryToTrolley(p);
    think(`${p.order} … was that this pallet?`); await wait(0.8);
    await readPaper('Tally mark', 0.6); placed(p); think(null);
  }
  step(4, 'Unsure whether pallet OR13 already has enough pieces: the operator walks back and counts again.');
  const t0 = trolleys[0], ts = trolleyStand(t0); await walkTo(ts.x, ts.z, ts.face);
  think('11 … or was it 10?'); await arms(-0.9, -0.9, 0.3); await wait(1.8); await arms(0, 0, 0.3); think(null);
  hud.rechecks++; renderHud();
  step(5, 'Fast-forward: the rest of the sheet is sorted the same way, with a look-up, a search and a tally for every piece.');
  autoCam('overview'); await walkTo(0.2, 1.5, 0);
  await ffPieces(seq.filter(p => p.status === 'open'));
  step(6, 'Sheet done. A wrong pallet or a wrong count is only found later, at final inspection.');
  await walkTo(-1.0, 3.4, Math.PI); await palletIn();
}

async function runV3() {
  await intro();
  step(1, 'The colour layout was printed when the job was released. The office chose the pallets: one per order.');
  await walkTo(-2.0, 3.0, -Math.PI / 2); await arms(0, -1.2, 0.25);
  displayGroup.userData.paper.visible = true; drawPaper(); await arms(0, 0, 0.2);
  autoCam('display'); await goToDisplay(); await wait(1.6);
  step(2, 'Three pallets are brought in and the operator places the cards shown in the print legend on them: <b>Blue 1</b>, <b>Orange 2</b>, <b>Green 3</b>.');
  autoCam('overview'); await rollTrolleysIn(trolleys); await placeCards();
  const names = ['Blue = the long ones', 'Orange = short with the tab', 'Green = the small plates'];
  for (const [i, pl] of plan.entries()) {
    step(3 + i, i === 1
      ? 'Sort <b>Orange 2</b>. The print marks in red where 1045575 differs from its look-alike 1045574, but the operator still compares print and sheet by eye.'
      : `Sort <b>${pl.label}</b>: compare the print with the sheet, pick the ${pl.name.toLowerCase()} pieces, tick them off on the print.`);
    autoCam('operator');
    const list = piecesOf(pl), anim = list.slice(0, i === 2 ? 0 : (i === 0 ? 2 : 1));
    for (const p of anim) {
      await readPaper(names[i], 0.9); think(null);
      showArrow(p); await carryToTrolley(p); await readPaper('Tick ✓', 0.4); placed(p); think(null);
    }
    autoCam('overview'); await walkTo(0.2, 1.5, 0); await ffPieces(piecesOf(pl));
  }
  step(6, 'Sheet done. Counting is by hand on the print, and the pallet plan could not be changed at the machine.');
  await walkTo(-1.0, 3.4, Math.PI); await palletIn();
}

async function screenSetup(stepBase, { cobotAuto = false } = {}) {
  const iCount = stepBase, iAssign = cobotAuto ? stepBase : stepBase + 1, iCards = cobotAuto ? stepBase + 1 : stepBase + 2;
  // Setup 2 of 4: how many pallets (the app suggests one per order)
  ui.mode = 'count'; ui.count = 3; applyPlan(makePlan(PROPOSAL)); drawScreen(); autoCam('display');
  if (cobotAuto) {
    step(iAssign, 'Setup: the app suggests 3 pallets, one per order. Parts ≤ 2 kg go to the cobot (Orange 2 and Green 3, in its zone), the heavy 1045574 to the operator (Blue 1).');
    await wait(1.6); await tapScreen(...ui.hit.next);
    applyPlan(finalPlan); ui.mode = 'assign'; drawScreen(); await wait(2.6); hud.setup++; renderHud();
  } else {
    step(iCount, 'Setup 2 of 4: how many pallets? The app suggests 3, one per order. The operator decides 2 are enough.');
    await wait(1.6);
    await tapScreen(...ui.hit.minus); ui.count = 2; applyPlan(makePlan([[['1045574', '1045575']], [['1045572']]])); drawScreen();
    hud.setup++; renderHud(); await wait(0.8);
    await tapScreen(...ui.hit.next);
    // Setup 3 of 4: which parts on which pallet (the app's proposal for 2 pallets, then two taps)
    ui.mode = 'assign'; drawScreen();
    step(iAssign, 'Setup 3 of 4: the app proposes 1045574 + 1045575 on Blue 1 and 1045572 on Orange 2. The operator wants 1045575 on a pallet of its own: two taps.');
    await wait(2.4);
    await tapScreen(...ui.hit.chip[PARTNOS.indexOf('1045575')][1]);
    applyPlan(makePlan([[['1045574']], [['1045575', '1045572']]])); drawScreen(); await wait(0.6);
    await tapScreen(...ui.hit.chip[PARTNOS.indexOf('1045572')][0]);
    applyPlan(finalPlan); hud.setup++; renderHud(); drawScreen(); await wait(1.4);
  }
  await tapScreen(...ui.hit.next);
  // Setup 4 of 4: place the cards on the pallets, then Ready
  ui.mode = 'cards'; drawScreen();
  step(iCards, `Setup 4 of 4: the operator places the reusable cards on the pallets: ${plan.map(q => `<b>${q.label}</b>`).join(', ')}. Then Ready.`);
  await wait(1.4);
  autoCam('overview');
  await rollTrolleysIn(trolleys); await placeCards();
  await tapScreen(...ui.hit.ready);
}

// The pieces of a pallet still to be carried (picked up, not yet on the pallet).
const toCarry = pl => pieces.filter(p => p.pallet === pl && p.status === 'open' && !p.onPallet && p.mesh.visible).sort((a, b) => a.cx - b.cx);

// "✓ Blue 1 done": every piece still open on the pallet counts as picked (missing ones stay missing).
function confirmPallet(pl) {
  const list = pieces.filter(p => p.pallet === pl && p.status === 'open');
  list.forEach(p => placed(p));
  const miss = pieces.filter(p => p.pallet === pl && p.status === 'missing').length;
  const nextPl = plan.find(q => q.who === 'human' && pieces.some(p => p.pallet === q && p.status === 'open'));
  ui.feedback = !nextPl ? `✓ ${pl.label} done: ${list.length} pieces picked.`
    : miss ? `${pl.label} done but incomplete: ${miss} missing or scrap. Now: ${nextPl.label}.`
      : `✓ ${pl.label} complete. Now: ${nextPl.label}.`;
  if (nextPl && !V.cobot) ui.active = [nextPl.num];
  ui.next = nextPl ? firstOpen(nextPl) : null;
  redraw();
}

// A piece is not on the sheet: the only time the operator touches the screen while sorting.
async function reportMissing(p, stepIdx) {
  step(stepIdx, `One <b>${p.partNo}</b> is not on the sheet (it dropped through the grid). Only now does the operator touch the screen: tap the piece, then <b>Missing</b>.`);
  autoCam('operator'); showQuestionMarks([p]); think(`Where is this ${p.partNo}?`); await wait(1.6); think(null);
  autoCam('display');
  await tapScreen(...pieceScreenXY(p));
  ui.selected = p; ui.feedback = `${p.partNo} selected. Press Confirm or tap it again to pick it.`; drawScreen(); await wait(0.8);
  await tapScreen(...ui.hit.missing);
  p.status = 'missing'; ui.selected = null; ui.feedback = `${p.partNo} marked as missing`; ui.next = firstOpen(p.pallet);
  showQuestionMarks([]); drawScreen(); await wait(1.2);
}

// One pallet, as in the app: carry all its pieces without touching the screen, then one tap on "✓ Blue 1 done".
async function sortHumanPallet(pl, nAnim, stepIdx, html, { missing = null, doneStep = stepIdx } = {}) {
  ui.mode = 'sort'; ui.active = V.cobot ? plan.map(q => q.num) : [pl.num]; ui.selected = null;
  ui.next = firstOpen(pl); drawScreen();
  step(stepIdx, html); autoCam('operator');
  for (const p of toCarry(pl).slice(0, nAnim)) {
    showArrow(p); think(`Follow the ${pl.name.toLowerCase()}`);
    await carryToTrolley(p); think(null); p.onPallet = true;
  }
  if (missing) await reportMissing(missing, stepIdx);
  autoCam('overview'); await walkTo(0.2, V.table ? 4.6 : 1.5, Math.PI);
  await ffPieces(toCarry(pl));
  step(doneStep, `All <b>${pl.label}</b> pieces are on the pallet. One tap on <b>✓ ${pl.label} done</b> confirms them all${missing ? ' (the missing piece stays missing)' : ''}.`);
  autoCam('display'); await tapScreen(...ui.hit.palletDone);
  confirmPallet(pl);
  await wait(1.6);
}

async function summary(stepIdx, html) {
  ui.mode = 'done'; ui.active = []; ui.next = null; drawScreen();
  step(stepIdx, html);
  autoCam('display'); await wait(2.5); autoCam('overview');
}

async function runV1() {
  const lost = pieces.find(p => p.n === 25);   // demo case: one 1045572 has dropped through the grid
  lost.mesh.visible = false;
  await intro();
  step(1, 'The operator walks to the touchscreen next to the pallet changer and taps <b>J14</b> in today\'s job list.');
  ui.mode = 'list'; drawScreen(); autoCam('display'); await tapScreen(...ui.hit.job);
  await screenSetup(2);
  await sortHumanPallet(plan[0], 3, 5, 'Sort <b>Blue 1</b>: only its pieces are highlighted, the rest is grey. The operator sorts the whole pallet without touching the screen.', { missing:lost, doneStep:6 });
  await sortHumanPallet(plan[1], 2, 7, 'The app moved on to <b>Orange 2</b> by itself. 1045575 has no part file yet, so the screen shows its box.');
  await summary(8, `Sheet complete with ${hud.taps} taps while sorting 33 pieces. The summary is honest: Blue 1 is incomplete (1 missing). Pallet A goes back into the laser.`);
  await walkTo(-1.0, 3.4, Math.PI); await palletIn();
}

async function runV2() {
  await intro();
  step(1, 'The crane lifts the whole sheet onto the sorting table. The empty pallet goes straight back, so the laser can cut the next sheet.');
  await craneToTable();
  step(2, 'The operator rolls the screen stand to the table (Wi-Fi, no cable) and taps <b>J14</b>.');
  ui.mode = 'list'; drawScreen();
  const s0 = standGroup.position.clone(), r0 = standGroup.rotation.y, r1 = yawTo(DISP_TABLE, DISP_TABLE_STAND);
  await walkTo(s0.x + 0.35, s0.z + 0.35, yawTo(worker.position, s0));
  const w0 = worker.position.clone(), w1 = DISP_TABLE.clone().add(V3(0.35, 0, -0.45));
  worker.userData.walking = true;
  await tween(3.2, f => { standGroup.position.lerpVectors(s0, DISP_TABLE, f); standGroup.rotation.y = r0 + (r1 - r0) * f; worker.position.lerpVectors(w0, w1, f); worker.rotation.y = Math.atan2(w1.x - w0.x, w1.z - w0.z); }, f => f);
  worker.userData.walking = false; worker.userData.legL.rotation.x = worker.userData.legR.rotation.x = 0;
  autoCam('display'); await tapScreen(...ui.hit.job);
  await screenSetup(3);
  await sortHumanPallet(plan[0], 3, 6, 'Sort <b>Blue 1</b> at the table: only its pieces are highlighted. No taps while sorting.');
  await sortHumanPallet(plan[1], 2, 7, 'The app moved on to <b>Orange 2</b> by itself.');
  await summary(8, `Sheet complete with ${hud.taps} taps while sorting. Meanwhile the laser has already been cutting the next sheet.`);
}

async function runV4() {
  await intro();
  step(1, 'The crane lifts the sheet onto the sorting table, between the operator and the cobot. The pallet goes straight back into the laser.');
  await craneToTable();
  step(2, 'The operator taps <b>J14</b> on the screen at the table.');
  ui.mode = 'list'; drawScreen(); autoCam('display'); await tapScreen(...ui.hit.job);
  await screenSetup(3, { cobotAuto:true });
  // parallel sorting
  const human = plan[0], cobotPieces = [...piecesOf(plan[1]), ...piecesOf(plan[2])];
  cobotPieces[2].fail = true;
  ui.mode = 'sort'; ui.active = plan.map(q => q.num); ui.next = firstOpen(human); drawScreen();
  step(5, 'Parallel sorting: the cobot takes the light parts and reports every piece itself; the operator sorts the heavy <b>1045574</b> onto Blue 1 and confirms it once at the end. (Cobot cycle shortened in the demo.)');
  autoCam('overview');
  let fast = false;
  const cobotJob = (async () => { for (const p of cobotPieces) await cobotPick(p, fast ? 0.3 : 1); await cobotMove(V3(0, 1.15, 2.95), 1.0); })();
  const humanJob = (async () => {
    for (const p of toCarry(human).slice(0, 3)) { showArrow(p); await carryToTrolley(p); p.onPallet = true; }
    fast = true; await walkTo(0.2, 4.6, Math.PI); await ffPieces(toCarry(human), 0.3);
    await tapScreen(...ui.hit.palletDone); confirmPallet(human);
  })();
  await Promise.all([cobotJob, humanJob]);
  const h = pieces.find(p => p.handover);
  if (h) {
    step(6, `Hand-over: the cobot could not lift one <b>${h.partNo}</b> (a micro-joint held it). The cobot is parked, so the operator can enter its zone, break the piece free, place it on <b>${h.pallet.label}</b>, then tap it on the screen and <b>Confirm pick</b>.`);
    autoCam('operator'); showArrow(h);
    think('Break the micro-joint'); await carryToTrolley(h); think(null);
    autoCam('display');
    await tapScreen(...pieceScreenXY(h)); ui.selected = h; ui.feedback = `${h.partNo} selected. Press Confirm or tap it again to pick it.`; drawScreen(); await wait(0.6);
    await tapScreen(...ui.hit.confirm); h.handover = false; ui.selected = null; placed(h); ui.feedback = `✓ ${h.partNo} placed on ${h.pallet.label}`; drawScreen(); await wait(1.2);
  }
  await summary(7, `Sheet complete. Operator and cobot sorted in parallel with ${hud.taps} taps on the screen, and the laser kept cutting.`);
}

async function scenario() {
  playing = true;
  await ({ v0:runV0, v1:runV1, v2:runV2, v3:runV3, v4:runV4 }[VID])();
  stepItems.forEach(li => li.className = 'done');
  caption.innerHTML = 'Done. Try another variant in the tabs above, or <b>Restart</b>.';
  showArrow(null); think(null);
  playing = false;
}

// =====================================================================
// UI wiring and render loop
// =====================================================================
document.getElementById('play').onclick = () => { if (!playing) { paused = false; scenario(); } else paused = false; };
document.getElementById('pause').onclick = () => paused = !paused;
document.getElementById('restart').onclick = () => location.reload();
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  speed = +b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => cam(b.dataset.cam));
document.getElementById('labels').onchange = e => labels.forEach(l => l.visible = e.target.checked);
window.__disp = dispCanvas;
if (new URLSearchParams(location.search).has('autoplay')) setTimeout(() => document.getElementById('play').click(), 300);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) {
    simT += dt * speed;
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i], f = Math.min((simT - tw.t0) / tw.dur, 1);
      tw.update(tw.easing(f));
      if (f >= 1) { tweens.splice(i, 1); tw.res(); }
    }
    const u = worker.userData;
    if (u.walking) { u.phase += dt * speed * 9; u.legL.rotation.x = Math.sin(u.phase) * 0.5; u.legR.rotation.x = -Math.sin(u.phase) * 0.5; }
    if (arrow.visible) arrow.position.y = 1.2 + Math.sin(simT * 5) * 0.05;
  }
  const top = 3.65, bot = spreader.position.y + 0.09;
  cable.scale.y = Math.max(top - bot, 0.01); cable.position.y = (top + bot) / 2;
  if (camAnim) {
    const f = Math.min((performance.now() - camAnim.start) / camAnim.dur, 1), e = ease(f);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e); controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (f >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
